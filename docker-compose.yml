services:
  spark-app:
    build: .
    container_name: spotify_pyspark_container
    volumes:
      - .:/app
      - C:\Users\noraf\datos masivos\datos_spoti:/data
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    build: .
    container_name: spotify_dashboard
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0